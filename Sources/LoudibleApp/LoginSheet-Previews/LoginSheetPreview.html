<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LoginSheet.swift previews</title>
  <style>
    body { margin: 32px; font: 16px system-ui, sans-serif; background: #f4f4f6; color: #222; }
    main { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 24px; }
    figure { margin: 0; padding: 16px; background: white; border-radius: 12px; max-width: 100%; }
    figcaption { margin-bottom: 12px; font-weight: 600; }
    small { display: block; margin-top: 4px; font-weight: 400; color: #666; }
    img { display: block; max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <h1>LoginSheet.swift</h1>
  <p>4 previews. Select an image to view it at full size.</p>
  <main>
<figure id="loginIdle">
  <figcaption>Sign-in – idle <small>loginIdle</small></figcaption>
  <a href="images/loginIdle.png">
    <img src="images/loginIdle.png" alt="Sign-in – idle"
         width="520" loading="lazy">
  </a>
</figure>
<figure id="loginRegistering">
  <figcaption>Sign-in – registering <small>loginRegistering</small></figcaption>
  <a href="images/loginRegistering.png">
    <img src="images/loginRegistering.png" alt="Sign-in – registering"
         width="520" loading="lazy">
  </a>
</figure>
<figure id="loginError">
  <figcaption>Sign-in – error <small>loginError</small></figcaption>
  <a href="images/loginError.png">
    <img src="images/loginError.png" alt="Sign-in – error"
         width="520" loading="lazy">
  </a>
</figure>
<figure id="loginPastedURL">
  <figcaption>Sign-in – pasted URL <small>loginPastedURL</small></figcaption>
  <a href="images/loginPastedURL.png">
    <img src="images/loginPastedURL.png" alt="Sign-in – pasted URL"
         width="520" loading="lazy">
  </a>
</figure>
  </main>
</body>
</html>
