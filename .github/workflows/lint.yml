name: Swift style

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Cache Swift tools
        uses: actions/cache@v4
        with:
          path: .build/tools
          key: swift-style-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Scripts/lint.sh', 'Scripts/format.sh') }}
      - name: Check line wrapping
        run: Scripts/format.sh --lint
      - name: Lint
        run: Scripts/lint.sh
